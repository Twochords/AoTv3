# Manual PK overrides for tables that lack a declared PRIMARY KEY
# or where schema-reported PKs are wrong.
# Config entries take priority over information_schema.
# Format:
#   [table_name]
#   pk = col1[, col2, ...]


[adventure_template_entry]
pk = id, template_id

[items]
pk = id


[profanity_list]
pk = word

[spawn_condition_values]
pk = id, zone, instance_id


[veteran_reward_templates]
pk = claim_id
